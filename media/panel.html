<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foreshadow Context</title>
  <style>
    :root {
      --bg: var(--vscode-editor-background, #1e1e1e);
      --fg: var(--vscode-foreground, #cccccc);
      --muted: var(--vscode-descriptionForeground, #999999);
      --code-bg: var(--vscode-textCodeBlock-background, #252526);
      --border: var(--vscode-widget-border, #3c3c3c);
      --accent: var(--vscode-button-background, #705697);
      --accent-fg: var(--vscode-button-foreground, #ffffff);
      --font: var(--vscode-font-family, "Segoe UI", system-ui, sans-serif);
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font);
      color: var(--fg);
      background: var(--bg);
      margin: 0;
      padding: 10px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    button {
      border: 1px solid var(--border);
      background: var(--accent);
      color: var(--accent-fg);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: var(--fg);
    }
    button:hover { filter: brightness(1.08); }
    .meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
      margin-right: 6px;
      font-size: 11px;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 11px;
      line-height: 1.45;
      background: var(--code-bg);
      padding: 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      margin: 0;
      max-height: calc(100vh - 120px);
      overflow: auto;
    }
    .preview-banner {
      display: none;
      font-size: 11px;
      color: #f0c674;
      border: 1px solid #665522;
      background: #332b12;
      border-radius: 4px;
      padding: 6px 8px;
      margin-bottom: 8px;
    }
    body.preview .preview-banner { display: block; }
  </style>
</head>
<body>
  <div class="preview-banner" id="previewBanner">
    UI 预览模式（mock 数据）— 通过 <code>pnpm dev:ui</code> 启动
  </div>
  <h2>Foreshadow Context</h2>
  <div class="toolbar">
    <button id="btnCopy" type="button">复制 JSON</button>
    <button id="btnExpand" class="secondary" type="button">展开/折叠</button>
  </div>
  <div class="meta" id="meta">waiting...</div>
  <pre id="json">{}</pre>
  <script>
    const meta = document.getElementById('meta');
    const jsonEl = document.getElementById('json');
    const previewBanner = document.getElementById('previewBanner');
    let lastPayload = null;
    let compact = false;

    function render(payload) {
      lastPayload = payload || {};
      const p = lastPayload;
      const logsLen = Array.isArray(p.logs) ? p.logs.length : (p.logsCount ?? 0);
      const tasksLen = Array.isArray(p.tasks) ? p.tasks.length : (p.tasksCount ?? 0);
      const completeness = p.completeness ?? '-';
      meta.innerHTML =
        '<span class="badge">completeness: ' + completeness + '</span>' +
        '<span class="badge">logs: ' + logsLen + '</span>' +
        '<span class="badge">tasks: ' + tasksLen + '</span>';
      const ctx = p.context != null ? p.context : p;
      jsonEl.textContent = JSON.stringify(ctx, null, compact ? 0 : 2);
    }

    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (msg && msg.type === 'update') {
        render(msg.payload || {});
      }
    });

    document.getElementById('btnCopy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(jsonEl.textContent || '{}');
        meta.innerHTML += ' <span class="badge">copied</span>';
      } catch (e) {
        console.error(e);
      }
    });

    document.getElementById('btnExpand').addEventListener('click', () => {
      compact = !compact;
      if (lastPayload) render(lastPayload);
    });

    // Standalone preview hook (dev:ui injects window.__FORESHADOW_PREVIEW__)
    if (window.__FORESHADOW_PREVIEW__) {
      document.body.classList.add('preview');
      previewBanner.style.display = 'block';
    }
  </script>
</body>
</html>
